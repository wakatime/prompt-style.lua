---
"on":
  push:
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

# https://github.com/softprops/action-gh-release/issues/236
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get -y install libreadline-dev
      - uses: actions/checkout@v7
      - uses: lumen-oss/luarocks-tag-release@v9
        env:
          LUX_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
          HISTORY_LIBDIR: /usr/lib/x86_64-linux-gnu
        with:
          name: prompt-style
          dependencies: |
            luaprompt
            datafile
            argparse-temp
            warna
            luafilesystem
      - name: Pack
        env:
          HISTORY_LIBDIR: /usr/lib/x86_64-linux-gnu
        run: |
          lx --lua-version=5.1 pack
      - uses: actions/upload-artifact@v7
        if: "! startsWith(github.ref, 'refs/tags/')"
        with:
          path: |
            *.rock
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            *.rock
      - name: Upload
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          scripts/upload.sh ./*.rock
        env:
          LUAROCKS_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
