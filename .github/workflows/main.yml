---
"on":
  push:
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get -y update
          sudo apt-get -y install libreadline-dev
      - uses: lumen-oss/luarocks-tag-release@v9
        env:
          LUX_API_KEY: ${{secrets.LUAROCKS_API_KEY}}
          HISTORY_INCDIR: /usr/include
          HISTORY_LIBDIR: /usr/lib/x86_64-linux-gnu
          READLINE_INCDIR: /usr/include
          READLINE_LIBDIR: /usr/lib/x86_64-linux-gnu
        with:
          name: prompt-style
          dependencies: |
            luaprompt
            datafile
            argparse-temp
            warna
            luafilesystem

  deploy-aur:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: Freed-Wu/update-aur-package@v1.0.11
        if: startsWith(github.ref, 'refs/tags/')
        with:
          package_name: lua-prompt-style
          ssh_private_key: ${{secrets.AUR_SSH_PRIVATE_KEY}}

  deploy-nur:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Trigger Workflow
        run: >
          curl -X POST -d '{"ref":"main"}'
          -H "Accept: application/vnd.github.v3+json"
          -H "Authorization: Bearer ${{secrets.GH_TOKEN}}"
          https://api.github.com/repos/Freed-Wu/nur-packages/actions/workflows/version.yml/dispatches
